<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS | Collection</title>
    <link href="collection.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />

    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #fdfdfd;
      }
      #navbar {
        display: flex;
        justify-content: space-between;
        padding: 20px 5%;
        background: white;
        border-bottom: 1px solid #eee;
      }
      .nav-links a {
        margin: 0 15px;
        text-decoration: none;
        color: #444;
        font-size: 13px;
      }

      .container {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 40px;
        padding: 40px 5%;
      }

      aside {
        background: white;
        border: 1px solid #eee;
        padding: 20px;
        height: fit-content;
      }
      aside h3 {
        margin: 15px 0 10px;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
      }

      .product-card {
        border: 1px solid #eee;
        padding: 10px;
        text-align: center;
        position: relative;
      }
      .product-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
      }

      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #d4af37;
        padding: 4px 8px;
        font-size: 11px;
      }
      .sold-out {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      button {
        padding: 6px 15px;
        border: none;
        background: #1a1a1a;
        color: white;
        cursor: pointer;
      }

      input[type="checkbox"] {
        margin-right: 6px;
      }
    </style>
  </head>

  <body>
    <nav id="navbar">
      <div class="name"><strong>NEXUS</strong></div>
      <div class="nav-links">
        <a href="index1.html">HOME</a>
        <a href="cart.html">CART</a>
      </div>
    </nav>

    <div class="container">
      <aside>
        <h2>Filters</h2>

        <h3>Category</h3>
        <label
          ><input
            type="checkbox"
            class="filter-category"
            value="shirt"
          />Shirts</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-category"
            value="pant"
          />Pants</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-category"
            value="shoe"
          />Shoes</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-category"
            value="western"
          />Western</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-category"
            value="traditional"
          />Traditional</label
        >

        <h3>Gender</h3>
        <label
          ><input type="checkbox" class="filter-gender" value="men" />Men</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-gender"
            value="women"
          />Women</label
        >

        <h3>Location</h3>
        <label
          ><input
            type="checkbox"
            class="filter-location"
            value="hyderabad"
          />Hyderabad</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-location"
            value="mumbai"
          />Mumbai</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-location"
            value="delhi"
          />Delhi</label
        >
        <label
          ><input
            type="checkbox"
            class="filter-location"
            value="bengaluru"
          />Bengaluru</label
        >

        <h3>Size</h3>
        <label><input type="checkbox" class="filter-size" value="S" />S</label>
        <label><input type="checkbox" class="filter-size" value="M" />M</label>
        <label><input type="checkbox" class="filter-size" value="L" />L</label>

        <h3>Max Price</h3>
        <input type="range" min="500" max="3000" value="3000" id="priceRange" />
        <p>Up to ₹<span id="priceValue">3000</span></p>
      </aside>

      <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
      const products = [
        {
          id: 1,
          name: "Classic White Shirt",
          price: 799,
          stock: 5,
          category: "shirt",
          gender: "men",
          location: "hyderabad",
          size: "M",
          best: true,
          image:
            "https://images.unsplash.com/photo-1603252109303-2751441dd157?w=600",
        },
        {
          id: 2,
          name: "Black Formal Pant",
          price: 999,
          stock: 0,
          category: "pant",
          gender: "men",
          location: "mumbai",
          size: "L",
          best: false,
          image:
            "https://images.unsplash.com/photo-1583001809909-6e6a2ecbcd5b?w=600",
        },
        {
          id: 3,
          name: "Western Dress",
          price: 1299,
          stock: 4,
          category: "western",
          gender: "women",
          location: "bengaluru",
          size: "S",
          best: true,
          image:
            "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600",
        },
        {
          id: 4,
          name: "Traditional Lehenga",
          price: 1999,
          stock: 3,
          category: "traditional",
          gender: "women",
          location: "delhi",
          size: "M",
          best: true,
          image:
            "https://images.unsplash.com/photo-1617137968427-85924c800a22?w=600",
        },
        {
          id: 5,
          name: "Brown Leather Shoes",
          price: 1499,
          stock: 6,
          category: "shoe",
          gender: "men",
          location: "hyderabad",
          size: "L",
          best: false,
          image:
            "https://images.unsplash.com/photo-1528701800489-20be3c66de50?w=600",
        },
        {
          id: 6,
          name: "Blue Denim Shirt",
          price: 899,
          stock: 5,
          category: "shirt",
          gender: "men",
          location: "mumbai",
          size: "M",
          best: false,
          image:
            "https://images.unsplash.com/photo-1589310243389-96a5483213a8?w=600",
        },
        {
          id: 7,
          name: "Women Casual Pants",
          price: 1199,
          stock: 4,
          category: "pant",
          gender: "women",
          location: "bengaluru",
          size: "S",
          best: true,
          image:
            "https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?w=600",
        },
      ];

      const grid = document.getElementById("productGrid");

      function renderProducts(list) {
        grid.innerHTML = "";

        if (list.length === 0) {
          grid.innerHTML = "<h2>No Items Found</h2>";
          return;
        }

        list.forEach((p) => {
          grid.innerHTML += `
<div class="product-card">
${p.best ? '<div class="badge">Best Seller</div>' : ""}
${p.stock === 0 ? '<div class="sold-out">SOLD OUT</div>' : ""}
<img src="${p.image}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<p style="font-size:12px;color:#777;text-transform:uppercase;">${p.location}</p>
${p.stock > 0 ? `<button onclick="addToCart(${p.id})">Add to Cart</button>` : `<p style="color:red;">Out of Stock</p>`}
</div>`;
        });
      }

      function applyFilters() {
        let filtered = [...products];

        const categories = [
          ...document.querySelectorAll(".filter-category:checked"),
        ].map((el) => el.value);
        if (categories.length)
          filtered = filtered.filter((p) => categories.includes(p.category));

        const genders = [
          ...document.querySelectorAll(".filter-gender:checked"),
        ].map((el) => el.value);
        if (genders.length)
          filtered = filtered.filter((p) => genders.includes(p.gender));

        const locations = [
          ...document.querySelectorAll(".filter-location:checked"),
        ].map((el) => el.value);
        if (locations.length)
          filtered = filtered.filter((p) => locations.includes(p.location));

        const sizes = [
          ...document.querySelectorAll(".filter-size:checked"),
        ].map((el) => el.value);
        if (sizes.length)
          filtered = filtered.filter((p) => sizes.includes(p.size));

        const maxPrice = parseInt(document.getElementById("priceRange").value);
        filtered = filtered.filter((p) => p.price <= maxPrice);

        renderProducts(filtered);
      }

      function addToCart(id) {
        const product = products.find((p) => p.id === id);
        if (!product || product.stock === 0) return;

        let cart = JSON.parse(localStorage.getItem("nexusCart")) || [];

        const existing = cart.find((item) => item.id === id);

        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            quantity: 1,
          });
        }

        localStorage.setItem("nexusCart", JSON.stringify(cart));
        alert("Added to Cart");
      }

      document
        .querySelectorAll("input[type=checkbox]")
        .forEach((el) => el.addEventListener("change", applyFilters));
      document
        .getElementById("priceRange")
        .addEventListener("input", function () {
          document.getElementById("priceValue").innerText = this.value;
          applyFilters();
        });

      renderProducts(products);
    </script>
  </body>
</html>
